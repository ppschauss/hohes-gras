# telegram-pokemon — Telegram Mini-App Spiel (Bot + API + Web in einem Container).
# Spiegel von manage.sh; der Unraid-Host hat kein compose-Plugin und nutzt manage.sh.
services:
  telegram-pokemon:
    container_name: telegram-pokemon
    build:
      context: ./build
    restart: unless-stopped
    env_file: ./secrets.env
    environment:
      TZ: Europe/Berlin
      DATA_DIR: /data
    ports:
      - "3010:3010"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3010/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
